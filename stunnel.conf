# TLS relay for clients that can't make the TLS connection themselves, such as
# SmartThings Edge drivers (the hub doesn't send SNI). Clients send plain HTTP to
# the accept port; stunnel connects to the real host over verified TLS with SNI.
#
# Each upstream host gets its own section and port, plus a matching
# mdns-responder line in script.sh advertising _tlsrelay._tcp with the host's
# dots replaced by dashes as the instance name.

foreground = yes
pid =

[api.anthropic.com]
client = yes
accept = 0.0.0.0:8091
connect = api.anthropic.com:443
sni = api.anthropic.com
verifyChain = yes
checkHost = api.anthropic.com
CAfile = /etc/ssl/certs/ca-certificates.crt
